spring.application.name=eventbooking

spring.mongodb.uri=mongodb://eventbooking_user:abc123@localhost:27017/eventbooking?

spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.boot.context.properties=TRACE

 app.jwt.secret=${JWT_SECRET:eventbooking-demo-secret-key-change-me-min-32-chars}
 app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

 # Seeded on startup if no user with this email exists yet - see config/AdminSeeder.java
 app.admin.name=${ADMIN_NAME:System Admin}
 app.admin.email=${ADMIN_EMAIL:admin@eventbooking.com}
 app.admin.password=${ADMIN_PASSWORD:Admin@12345}